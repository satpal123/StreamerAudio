name: Build Signed APK

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # ---------- PR builds (no secrets) ----------
      - name: Build Debug APK (PR-safe)
        if: github.event_name == 'pull_request'
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Rename Debug APK (PR-safe)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          META="app/build/outputs/apk/debug/output-metadata.json"

          VERSION_NAME="$(jq -r '.elements[0].versionName' "$META")"
          OUTPUT_FILE="$(jq -r '.elements[0].outputFile' "$META")"

          APK_IN="app/build/outputs/apk/debug/${OUTPUT_FILE}"
          APK_OUT="StreamerAudio-v${VERSION_NAME}-${SHORT_SHA}-debug.apk"

          cp "$APK_IN" "$APK_OUT"
          echo "Created: $APK_OUT"

      - name: Upload Debug APK artifact (PR-safe)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: StreamerAudio-debug-apk
          path: StreamerAudio-v*-debug.apk

      # ---------- Push/Tag builds (use secrets + signed release) ----------
      - name: Decode keystore
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.jks
          echo "ANDROID_KEYSTORE_PATH=${GITHUB_WORKSPACE}/release.jks" >> "$GITHUB_ENV"

      - name: Build Release APK (signed)
        if: github.event_name != 'pull_request'
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Build Debug APK
        if: github.event_name != 'pull_request'
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Rename APKs with version (push/tag)
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"

          rename_variant () {
            VARIANT="$1"
            META="app/build/outputs/apk/${VARIANT}/output-metadata.json"

            VERSION_NAME="$(jq -r '.elements[0].versionName' "$META")"
            VERSION_CODE="$(jq -r '.elements[0].versionCode' "$META")"
            OUTPUT_FILE="$(jq -r '.elements[0].outputFile' "$META")"

            APK_IN="app/build/outputs/apk/${VARIANT}/${OUTPUT_FILE}"
            APK_OUT="StreamerAudio-v${VERSION_NAME}(${VERSION_CODE})-${SHORT_SHA}-${VARIANT}.apk"

            cp "$APK_IN" "$APK_OUT"
            echo "Created: $APK_OUT"

            if [ "$VARIANT" = "release" ]; then
              echo "RELEASE_APK=$APK_OUT" >> "$GITHUB_ENV"
            fi
          }

          rename_variant "release"
          rename_variant "debug"

      - name: Upload Release APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: StreamerAudio-release-apk
          path: StreamerAudio-v*-release.apk

      - name: Upload Debug APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: StreamerAudio-debug-apk
          path: StreamerAudio-v*-debug.apk

      - name: Create GitHub Release and attach signed APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.RELEASE_APK }}
