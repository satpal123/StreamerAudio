name: Build Signed APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.jks
          echo "ANDROID_KEYSTORE_PATH=${GITHUB_WORKSPACE}/release.jks" >> "$GITHUB_ENV"

      - name: Build Release APK (signed)
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Build Debug APK
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Rename APKs with version (from output-metadata.json)
        run: |
          set -euo pipefail

          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"

          rename_variant () {
            VARIANT="$1"
            META="app/build/outputs/apk/${VARIANT}/output-metadata.json"

            if [ ! -f "$META" ]; then
              echo "ERROR: metadata not found: $META"
              ls -la "app/build/outputs/apk/${VARIANT}" || true
              exit 1
            fi

            VERSION_NAME="$(jq -r '.elements[0].versionName' "$META")"
            VERSION_CODE="$(jq -r '.elements[0].versionCode' "$META")"
            OUTPUT_FILE="$(jq -r '.elements[0].outputFile' "$META")"

            APK_IN="app/build/outputs/apk/${VARIANT}/${OUTPUT_FILE}"
            if [ ! -f "$APK_IN" ]; then
              echo "ERROR: APK not found: $APK_IN"
              ls -la "app/build/outputs/apk/${VARIANT}" || true
              exit 1
            fi

            APK_OUT="StreamerAudio-v${VERSION_NAME}-${SHORT_SHA}-${VARIANT}.apk"
            cp "$APK_IN" "$APK_OUT"
            echo "Created: $APK_OUT"
          }

          rename_variant "release"
          rename_variant "debug"

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamerAudio-release-apk
          path: StreamerAudio-v*-release.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamerAudio-debug-apk
          path: StreamerAudio-v*-debug.apk
